<!doctype html><html lang="ar" dir="rtl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>HyperBot · تسجيل الدخول</title>
<link rel="stylesheet" href="{{ url_for('dashboard-static', path='theme.css') }}">
<script src="{{ url_for('dashboard-static', path='theme.js') }}"></script></head><body class="login-page"><main class="login-card">
<div class="login-top"><div class="brand"><div class="logo-box"><img src="{{ url_for('dashboard-static', path='hyper-logo.png') }}" alt="هايبر تيم"></div><div class="brand-copy"><span class="brand-name" dir="ltr">HYPERBOT</span><small>لوحة إدارة الفريق · HYPER TEAM</small></div></div><button class="theme-toggle" type="button" data-theme-toggle aria-label="تفعيل الوضع النهاري" title="تبديل المظهر">☀</button></div><h1>لوحة إدارة HyperBot</h1><p>ملفات Hyper Vault ومناوبات الفريق في مكان واحد</p>
<form action="/login" method="post"><label for="pass">كلمة مرور الإدارة</label>
<input id="pass" name="passphrase" type="password" autocomplete="current-password" required autofocus>
{% if error %}<div class="error">{{error}}</div>{% endif %}
<button type="submit">دخول آمن</button></form>
<small>لوحة خاصة بالمشرفين. لا تضعها على استضافة عامة دون HTTPS.</small>
</main></body></html>
